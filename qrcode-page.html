<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - HISWA RECRON</title>
    <!-- Use Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0a1628;
            --accent-1: #0ea5e9;
            --accent-2: #06b6d4;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #112a4f, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            animation: fadeIn 1s ease-in-out;
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        .header {
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .instructions {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .qr-wrapper {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.05);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 300px;
        }

        #qrcode img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .url-display {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent-2);
            text-decoration: none;
            font-size: 1rem;
            word-break: break-all;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(6, 182, 212, 0.1);
            transition: all 0.2s;
        }

        .url-display:hover {
            background: rgba(6, 182, 212, 0.2);
            color: white;
        }

        .controls {
            margin-top: 2rem;
            width: 100%;
        }

        .input-group {
            display: flex;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        input[type="url"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--accent-1);
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: translateY(2px);
        }

        .btn-print {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
        }

        .btn-print:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Decorative background elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            border-radius: 50%;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: var(--accent-1);
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: var(--accent-2);
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                color: black;
                display: block;
                padding: 0;
            }
            .blob { display: none; }
            .controls { display: none; }
            .card {
                background: none;
                border: none;
                box-shadow: none;
                backdrop-filter: none;
                padding: 0;
                margin-top: 10vh;
            }
            .title {
                background: none;
                -webkit-text-fill-color: black;
                color: black;
            }
            .subtitle { color: #333; }
            .instructions { color: black; }
            .qr-wrapper {
                box-shadow: none;
                border: 2px solid #eee;
            }
            .url-display {
                background: none;
                color: black;
                border: 1px solid #ccc;
            }
            @page {
                margin: 2cm;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="header">
            <h1 class="title">HISWA RECRON</h1>
            <p class="subtitle">Scan untuk bermain - Gratis & Bisa Offline!</p>
        </div>

        <div class="card">
            <p class="instructions">Scan QR Code untuk bermain game</p>
            
            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>

            <a href="#" id="urlDisplay" class="url-display" target="_blank"></a>

            <div class="controls">
                <div class="input-group">
                    <input type="url" id="customUrl" placeholder="Masukkan custom URL (opsional)">
                    <button id="btnGenerate">Update</button>
                </div>
                <button id="btnPrint" class="btn-print">
                    <svg style="width:20px;height:20px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M18,3H6V7H18M19,12A1,1 0 0,1 18,11A1,1 0 0,1 19,10A1,1 0 0,1 20,11A1,1 0 0,1 19,12M16,19H8V14H16M19,8H5A3,3 0 0,0 2,11V17H6V21H18V17H22V11A3,3 0 0,0 19,8Z" />
                    </svg>
                    Print QR Code
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const qrContainer = document.getElementById('qrcode');
            const urlDisplay = document.getElementById('urlDisplay');
            const customUrlInput = document.getElementById('customUrl');
            const btnGenerate = document.getElementById('btnGenerate');
            const btnPrint = document.getElementById('btnPrint');

            // Derive default game URL (same origin + /index.html)
            let defaultUrl = window.location.href;
            if (defaultUrl.endsWith('qrcode-page.html')) {
                defaultUrl = defaultUrl.replace('qrcode-page.html', 'index.html');
            } else if (!defaultUrl.endsWith('/')) {
                defaultUrl += '/index.html';
            } else {
                defaultUrl += 'index.html';
            }

            function generateQRCode(url) {
                // Clear previous QR code
                qrContainer.innerHTML = '';
                
                try {
                    // Create QR code using qrcode-generator
                    const qr = qrcode(0, 'M'); // 0 = auto detect type number, M = error correction level
                    qr.addData(url);
                    qr.make();
                    
                    // Generate image tag, cell size = 8, margin = 0
                    qrContainer.innerHTML = qr.createImgTag(8, 0);
                    
                    // Update URL display
                    urlDisplay.textContent = url;
                    urlDisplay.href = url;
                } catch (e) {
                    console.error("Failed to generate QR code", e);
                    qrContainer.innerHTML = '<div style="color:red;padding:2rem">Error generating QR code. URL might be too long.</div>';
                }
            }

            // Initial generation
            generateQRCode(defaultUrl);
            customUrlInput.value = defaultUrl;

            // Handle generate button
            btnGenerate.addEventListener('click', () => {
                const url = customUrlInput.value.trim();
                if (url) {
                    generateQRCode(url);
                }
            });

            // Handle enter key in input
            customUrlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const url = customUrlInput.value.trim();
                    if (url) {
                        generateQRCode(url);
                    }
                }
            });

            // Handle print button
            btnPrint.addEventListener('click', () => {
                window.print();
            });
        });
    </script>
</body>
</html>
